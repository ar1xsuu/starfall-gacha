<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07040f">
<title>Starfall Gacha</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bk:#06020e;--gl:#ffffff12;--bd:#ffffff1f;--v:#7c3aed;--mg:#e11d8f;--lc:#e4d3ff;--mu:#a592cf;--gold:#f1e6ff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bk)}
body{color:#fff;font-family:'Outfit',system-ui,sans-serif}
#app{position:relative;display:flex;flex-direction:column;height:100%;max-width:520px;margin:auto;padding-top:env(safe-area-inset-top);overflow:hidden;background:radial-gradient(75% 38% at 10% 0,#6d1fd1b0,transparent),radial-gradient(60% 32% at 100% 30%,#e11d8f45,transparent),var(--bk)}
header{display:flex;align-items:center;gap:10px;padding:12px 16px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--v),var(--mg))}
.hi{flex:1;min-width:0;line-height:1.15}.hi small{display:block;font-size:12px;color:var(--mu)}
.hi b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{background:var(--gl);border:1px solid var(--bd);border-radius:99px;padding:6px 11px;font-weight:600;font-size:13px;text-align:center;backdrop-filter:blur(10px)}
main{flex:1;overflow:auto;padding:0 16px 120px}
nav{position:absolute;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;padding:7px;border-radius:99px;background:#14072eb8;border:1px solid var(--bd);backdrop-filter:blur(18px)}
nav button{display:flex;align-items:center;gap:6px;padding:10px 14px;border:0;border-radius:99px;background:none;color:var(--mu);font:600 14px Outfit,sans-serif}
nav span{font-size:20px}nav em{display:none;font-style:normal}
nav .on{background:linear-gradient(135deg,var(--v),var(--mg));color:#fff}nav .on em{display:inline}
h2{font-weight:800}h3{font-size:18px;font-weight:700;margin:18px 0 6px}
.t2{margin:14px 0 4px;font-size:38px;line-height:1}.t2 small{display:block;font-size:17px;font-weight:400;color:var(--mu);margin-bottom:2px}
.mu{color:var(--mu)}
.box,.stat{background:var(--gl);border:1px solid var(--bd);border-radius:22px;padding:16px;margin:14px 0;backdrop-filter:blur(12px)}
.row{display:flex;gap:10px;margin:10px 0}.row>*{flex:1}
.stat{margin:0;text-align:center;font-size:13px;color:var(--mu)}.stat b{display:block;font-size:24px;color:#fff}
.btn{display:block;width:100%;padding:15px;margin:10px 0 0;border:0;border-radius:18px;background:linear-gradient(135deg,var(--v),var(--mg));color:#fff;font:700 16px Outfit,sans-serif;box-shadow:0 8px 24px #e11d8f40}
.btn.gl{background:var(--gl);border:1px solid var(--bd);box-shadow:none}
.btn.gold{background:linear-gradient(135deg,#f1e6ff,#c4a1ff);color:#1a0a3a;box-shadow:0 8px 24px #c4a1ff40}
.btn.alt{background:#ffffff1a;box-shadow:none}
.btn.ghost{background:none;border:1px solid var(--bd);color:var(--mu);box-shadow:none}
.btn.danger{background:#7f1d1d;box-shadow:none}
.btn.sm{width:auto;padding:12px 18px;margin:0;font-size:15px}
.btn small{display:block;font-weight:400;font-size:12px;opacity:.85}
.btn:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--lc)}
.hero{position:relative;height:230px;border-radius:28px;overflow:hidden;margin:4px 0 16px;background:linear-gradient(135deg,#4c1d95,#0b0618);border:1px solid var(--bd)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero div{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;background:linear-gradient(transparent 20%,#06020ee6)}
.hero h1{font-size:clamp(34px,11.5vw,60px);font-weight:900;letter-spacing:.08em;line-height:.95;color:transparent;-webkit-text-stroke:2px #fff;text-shadow:0 0 28px #e11d8f}
.hero p{margin-top:8px;color:var(--lc)}
.scroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:8px 16px 14px}
.scroll .card{flex:none;width:72%;scroll-snap-align:center}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.grid.ten{grid-template-columns:repeat(5,1fr);gap:6px}
.card{position:relative;aspect-ratio:3/4;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;border:2px solid #ffffff30}
.card>*{position:relative;z-index:1}
.card b{position:absolute;left:12px;top:10px;font-size:13px;font-weight:800;text-shadow:0 1px 6px #000}
.card i{position:absolute;right:12px;top:10px;font-style:normal;font-weight:800}
.card em{position:absolute;inset:0;display:grid;place-items:center;font-size:76px;font-style:normal;filter:drop-shadow(0 8px 20px #0008)}
.nm{margin:8px;padding:9px 12px;border-radius:16px;background:#0a041a73;border:1px solid var(--bd);backdrop-filter:blur(10px);font-weight:800;font-size:15px;line-height:1.15}
.nm small{display:block;font-weight:400;font-size:12px;color:var(--lc)}
.card.SR,.pic.SR{border-color:#c084fc;box-shadow:0 0 18px #c084fc80}
.card.SSR,.pic.SSR{border-color:var(--gold);box-shadow:0 0 24px #f1e6ffaa}
.card.off{filter:grayscale(1) brightness(.4)}
.ten .card{border-radius:10px}.ten .nm{margin:3px;padding:3px 5px;font-size:10px}.ten .nm small{display:none}
.ten .card em{font-size:26px}.ten .card b,.ten .card i{font-size:10px;left:5px;top:4px}
.tag{display:inline-block;padding:3px 12px;border-radius:99px;font-size:12px;font-weight:700;background:var(--gl);border:1px solid var(--bd);margin-right:6px}
.tag.SR{background:#7e22ce;border-color:#c084fc}.tag.SSR{background:var(--gold);color:#1a0a3a;border-color:var(--gold)}
.tabs{display:flex;gap:18px;margin:12px 0}
.tabs button{background:none;border:0;color:var(--mu);font:600 15px Outfit,sans-serif;padding:4px 0}
.tabs .on{color:#fff}.tabs .on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mg);margin-right:7px;vertical-align:middle}
.bar{height:8px;background:#ffffff1a;border-radius:9px;margin:12px 0 6px;overflow:hidden}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--v),var(--mg))}
.dly{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tb{display:inline-block;min-width:62px;padding:8px 10px;margin:8px 8px 0 0;text-align:center;border-radius:14px;background:linear-gradient(135deg,var(--v),var(--mg));font-size:28px;font-weight:800}
.tb small{font-size:14px;font-weight:400}
input,select,textarea{width:100%;padding:13px;margin-top:6px;border-radius:14px;border:1px solid var(--bd);background:#ffffff0d;color:#fff;font:400 16px Outfit,sans-serif}
select option{background:#14072e}
input[type=checkbox]{width:auto;margin:0}
label{display:block;margin-top:12px;font-size:13px;color:var(--mu)}label.chk{display:flex;gap:8px;align-items:center}
.up{display:grid;place-items:center;height:130px;border-radius:18px;border:2px dashed var(--bd);color:#fff;font-weight:700;text-shadow:0 1px 8px #000;cursor:pointer;font-size:15px}
details summary{margin-top:8px;font-size:13px;color:var(--mu)}
.li{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--bd)}.li b{flex:1}
.li i{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-style:normal}
.ov{position:fixed;inset:0;background:#06020ef5;display:flex;flex-direction:column;justify-content:center;padding:20px;z-index:9;overflow:hidden;text-align:center}
.ov.m{background:#000a;justify-content:flex-end;padding:0;text-align:left}
.sheet{width:100%;max-width:520px;margin:auto auto 0;max-height:92%;overflow:auto;background:#12082a;border:1px solid var(--bd);border-radius:28px 28px 0 0;padding:18px}
.ov.d{justify-content:flex-start;padding:0;overflow:auto;text-align:left}
.dt{position:relative;width:100%;max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 20px 40px}
.back{width:42px;height:42px;border-radius:14px;border:1px solid var(--bd);background:var(--gl);color:#fff;font-size:24px}
.wm{position:absolute;left:0;right:0;top:calc(112px + env(safe-area-inset-top));z-index:2;text-align:center;text-transform:uppercase;font-size:clamp(60px,22vw,110px);font-weight:900;line-height:1;color:transparent;-webkit-text-stroke:2px #ffffff80;white-space:nowrap;overflow:hidden;pointer-events:none}
.stage{display:flex;align-items:center;gap:6px;margin:18px 0 8px}
.pic{flex:1;aspect-ratio:3/4;border-radius:28px;display:grid;place-items:center;font-size:110px;border:2px solid #ffffff30;box-shadow:0 20px 50px #0009}
.ar{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--bd);background:var(--gl);color:#fff;font-size:22px}
.bn{height:110px;border-radius:20px;margin:14px 0;display:flex;align-items:flex-end;padding:14px;font-weight:700;font-size:18px;border:1px solid var(--bd);text-shadow:0 1px 8px #000}
.ring{width:200px;height:200px;margin:auto;border:4px dashed var(--c);border-radius:50%;display:grid;place-items:center;animation:spin 2.2s ease-in}
.orb{width:70px;height:70px;border-radius:50%;background:var(--c);box-shadow:0 0 60px 20px var(--c);animation:burst 2.2s ease-in forwards}
.rv{width:68%;margin:auto;animation:flip .7s}
.rv .nm{font-size:20px}.rv .card em{font-size:110px}
.rv .card.SSR{animation:glow 1.2s infinite alternate}
.nt{margin-top:16px;font-weight:800;font-size:22px;color:var(--gold)}
.skip{position:absolute;right:16px;top:16px;background:var(--gl);border:1px solid var(--bd);color:#fff;border-radius:99px;padding:8px 18px;font:600 14px Outfit,sans-serif}
#msg{margin-top:10px;text-align:center;color:var(--lc);min-height:1.2em}
@keyframes spin{to{transform:rotate(540deg)}}
@keyframes burst{75%{transform:scale(1.5)}to{transform:scale(32);opacity:0}}
@keyframes flip{from{transform:rotateY(90deg) scale(.5);opacity:0}}
@keyframes glow{to{box-shadow:0 0 34px 6px var(--gold)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
/* v4: astral theme, mobile fixes, full-bleed banner, pull cutscenes */
:root{--bk:#04010c;--v:#5b3df5;--mg:#a64bf4;--lc:#dfe4ff;--mu:#9ba3d4}
*{scrollbar-width:none}::-webkit-scrollbar{display:none}
html{background:var(--bk)}
body{background:radial-gradient(120% 50% at 15% 0,#2a1070 0,transparent 60%),radial-gradient(90% 40% at 100% 45%,#3b0f6a99 0,transparent 60%);background-attachment:fixed}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{background:none;z-index:1;height:100dvh}
header{position:absolute;top:env(safe-area-inset-top);left:0;right:0;z-index:5;transition:background .25s}
header:not(.sc)::before{content:"";position:absolute;inset:0 0 -24px;background:linear-gradient(#04010ccc,transparent);z-index:-1;pointer-events:none}
header.sc{background:#04010cd9;backdrop-filter:blur(14px)}
main{padding:72px 16px 120px}
.hero{margin:-72px -16px 8px;height:min(430px,54vh);border-radius:0;border:0;background:none;overflow:visible}
.hero img{-webkit-mask-image:linear-gradient(#000 55%,transparent 98%);mask-image:linear-gradient(#000 55%,transparent 98%)}
.hero div{background:none;padding:0 20px 6px}
.hero h1{text-shadow:0 0 30px #7c5cff}
.scroll .card{width:148px}
.grid{grid-template-columns:repeat(3,1fr);gap:10px}
.grid .card{border-radius:16px}.grid .card em{font-size:44px}
.grid .nm{margin:5px;padding:6px 8px;font-size:12px}.grid .nm small{display:none}
.nm{background:#0a041a99;backdrop-filter:none}
.btn{box-shadow:0 8px 24px #5b3df566}
nav{padding:5px}nav button{padding:9px 12px}
.ov{background:radial-gradient(circle at 50% 42%,#1a0b4a,#04010c 70%)}
.ov.t1{background:radial-gradient(circle at 50% 42%,#33106a,#04010c 70%)}
.ov.t2{background:radial-gradient(circle at 50% 42%,#4b3a9e,#04010c 70%)}
.ov.m{background:#000a}.ov.d{background:#04010cf5}
.ov p{position:relative;z-index:1}
.fx{position:absolute;inset:0;overflow:hidden}
.meteor{position:absolute;top:-30vh;left:80%;width:3px;height:170px;border-radius:3px;background:linear-gradient(transparent,var(--c));box-shadow:0 0 12px var(--c);animation:fall 1.1s ease-in forwards}
.m2{left:55%;animation-delay:.35s}.m3{left:95%;animation-delay:.7s}
.meteor.big{width:10px;height:380px;left:85%;top:-45vh;background:linear-gradient(transparent,#fff 85%,var(--c));box-shadow:0 0 34px 6px var(--c);animation:crash 1.6s .1s cubic-bezier(.5,0,1,.7) forwards}
.glow{position:absolute;left:50%;top:50%;width:160px;height:160px;margin:-80px;border-radius:50%;background:radial-gradient(var(--c),transparent 70%);opacity:0;animation:pulse 1.3s .5s ease-out}
.ring2{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px;border:3px solid var(--c);border-radius:50%;opacity:0;animation:wave 1.1s 1.6s ease-out}
.ring2.d2{animation-delay:1.85s}
.flash{position:absolute;inset:0;background:#fff;opacity:0;animation:fl .8s 1.6s ease-out}
.sp{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);opacity:0;animation:sparkle 1.1s ease-out}
.const{position:absolute;left:50%;top:42%;width:min(80vw,380px);transform:translate(-50%,-50%)}
.const polyline{fill:none;stroke:var(--c);stroke-width:2;stroke-dasharray:700;stroke-dashoffset:700;filter:drop-shadow(0 0 6px var(--c));animation:draw 1.5s ease-out forwards}
.bars::before,.bars::after{content:"";position:absolute;left:0;right:0;height:11vh;background:#000;z-index:3}
.bars::before{top:0;animation:barT .5s}.bars::after{bottom:0;animation:barB .5s}
.slam{position:absolute;inset:0;display:grid;place-items:center;font-size:32vw;font-weight:900;color:#fff;-webkit-text-stroke:3px var(--c);text-shadow:0 0 40px var(--c),0 0 90px var(--c);opacity:0;animation:slam .5s 2.4s cubic-bezier(.2,1.6,.4,1) forwards}
.rays{position:absolute;left:50%;top:42%;width:120vmax;height:120vmax;margin:-60vmax;background:repeating-conic-gradient(var(--c) 0 5deg,transparent 5deg 15deg);-webkit-mask-image:radial-gradient(circle,#000,transparent 45%);mask-image:radial-gradient(circle,#000,transparent 45%);opacity:.28;animation:rot 14s linear infinite;pointer-events:none}
.fx .rays{opacity:0;animation:rot 14s linear infinite,fadein .6s 1.3s forwards}
.rv{position:relative;z-index:1}
.rv.r1{animation:flip .7s}.rv.r1 .card{animation:glow2 1.4s infinite alternate}
.rv.r2{animation:zoomin 1s cubic-bezier(.2,1.4,.3,1)}
.ov.shake{animation:shake .45s 2}
@keyframes fall{from{transform:rotate(35deg)}to{transform:translate(-73vh,105vh) rotate(35deg)}}
@keyframes crash{from{transform:rotate(19deg)}85%{opacity:1}to{transform:translate(-35vw,47vh) rotate(19deg);opacity:0}}
@keyframes pulse{50%{opacity:1;transform:scale(1.6)}to{opacity:0;transform:scale(2.2)}}
@keyframes wave{0%{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(18)}}
@keyframes fl{0%{opacity:1}to{opacity:0}}
@keyframes sparkle{0%{opacity:1;transform:rotate(var(--a)) translateX(0)}to{opacity:0;transform:rotate(var(--a)) translateX(var(--d))}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes barT{from{transform:translateY(-100%)}}
@keyframes barB{from{transform:translateY(100%)}}
@keyframes slam{from{opacity:0;transform:scale(4)}to{opacity:1;transform:scale(1)}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes fadein{to{opacity:.35}}
@keyframes glow2{to{box-shadow:0 0 36px 6px #c084fc}}
@keyframes zoomin{from{transform:scale(.2) rotate(-12deg);opacity:0;filter:brightness(4)}}
@keyframes shake{20%{transform:translate(-8px,6px)}40%{transform:translate(7px,-6px)}60%{transform:translate(-6px,-4px)}80%{transform:translate(5px,5px)}}
/* v5: compact mobile layout */
header{padding:8px 14px;gap:8px}
.av{width:34px;height:34px;font-size:15px}
.hi small{font-size:11px}.hi b{font-size:15px}
.chip{padding:4px 9px;font-size:12px}
main{padding:56px 14px 100px}
#app::after{content:"";position:absolute;left:0;right:0;bottom:0;height:84px;background:linear-gradient(transparent,#04010c 75%);pointer-events:none;z-index:9}
nav{z-index:10;left:12px;right:12px;bottom:calc(8px + env(safe-area-inset-bottom));padding:4px}
nav button{padding:7px 12px;font-size:12px;gap:5px}nav span{font-size:17px}
.hero{margin:-56px -14px 6px;height:min(250px,34vh)}
.hero img{object-position:center 35%}
.hero div{padding:0 16px 2px}
.hero h1{font-size:clamp(28px,9.5vw,42px);-webkit-text-stroke:1.5px #fff}
.hero p{font-size:13px;margin-top:4px}
h3{font-size:16px;margin:12px 0 4px}
.t2{font-size:28px;margin:8px 0 2px}.t2 small{font-size:14px}
.box,.stat{padding:12px;border-radius:16px;margin:10px 0}
.stat b{font-size:20px}
.btn{padding:12px;font-size:15px;border-radius:14px;margin-top:8px}
.btn.sm{padding:10px 14px;font-size:14px}.btn small{font-size:11px}
.tabs{margin:8px 0;gap:14px}.tabs button{font-size:14px}

.card{border-radius:14px}.card b{font-size:11px;left:8px;top:7px}.card em{font-size:44px}

.ar{width:32px;height:32px;font-size:18px}

.dt h2{font-size:26px!important;margin-top:10px!important}
.bn{height:84px;font-size:15px;margin:10px 0}
.up{height:100px}
.li i{width:38px;height:38px}
.rv{width:min(60%,34vh)}.rv .nm{font-size:16px}.rv .card em{font-size:84px}
.nt{font-size:18px;margin-top:12px}

/* v6: title lockup, profile, income, favourite picker */
.hero{overflow:hidden}
.hero .ttl{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:50px 12px 14px;gap:12px;background:radial-gradient(70% 55% at 50% 58%,#04010c80,transparent)}
.lock{position:relative;display:block}
.hero h1{margin:0;padding-left:.12em;font-size:clamp(34px,11.5vw,52px);font-weight:900;letter-spacing:.12em;line-height:1;color:transparent;-webkit-text-stroke:0;text-shadow:none;background:linear-gradient(100deg,#fff 0,#c9b8ff 28%,#a5b4fc 46%,#fff 56%,#d8b4fe 78%,#fff 100%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 12px #8b6cffcc) drop-shadow(0 2px 0 #1b0a52);animation:shine 5s linear infinite,hglow 3s ease-in-out infinite alternate}
.hero .sub{margin:0;display:flex;align-items:center;gap:10px;font-size:12.5px;letter-spacing:.06em;color:var(--lc)}
.hero .sub::before,.hero .sub::after{content:"";width:20px;height:1px;background:linear-gradient(90deg,transparent,#c9b8ff)}
.hero .sub::after{transform:scaleX(-1)}
.orbit{position:absolute;left:50%;top:50%;width:112%;aspect-ratio:1;border:1px solid #ffffff38;border-radius:50%;transform:translate(-50%,-50%) rotate(-12deg) scaleY(.3);pointer-events:none}
.orbit i{position:absolute;inset:0;animation:rot 9s linear infinite}
.orbit i::after{content:"";position:absolute;left:50%;top:-5px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px #9d7bff}
.sk{position:absolute;font-style:normal;color:#fff;text-shadow:0 0 8px #b9a4ff;animation:tw 2.6s ease-in-out infinite;pointer-events:none}
.sk.a{left:-12px;top:-8px;font-size:16px}.sk.b{right:-10px;top:0;font-size:11px;animation-delay:.9s}.sk.c{right:24%;bottom:-14px;font-size:13px;animation-delay:1.7s}
.hero .ttl::after{content:"";position:absolute;left:0;top:0;width:90px;height:2px;border-radius:2px;background:linear-gradient(270deg,transparent,#fff);opacity:0;animation:comet 7s 2s infinite}

.bsil{font-size:46vw;line-height:1;opacity:0;animation:rise 2.4s .5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{0%{opacity:0;transform:scale(.3) translateY(60px);filter:brightness(0)}35%{opacity:1;transform:scale(1);filter:brightness(0) drop-shadow(0 0 30px #fff)}70%{filter:brightness(0) drop-shadow(0 0 30px #fff)}100%{opacity:1;transform:scale(1.1);filter:brightness(1) drop-shadow(0 0 30px #a78bfa)}}
.bnm{position:absolute;left:0;right:0;bottom:12%;text-align:center;opacity:0;animation:slam .5s 2s cubic-bezier(.2,1.6,.4,1) forwards}
.bnm small{display:block;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--lc)}
.bnm b{display:block;font-size:clamp(26px,9vw,40px);font-weight:900;letter-spacing:.05em;text-shadow:0 0 22px #a78bfa}
/* v15: ability categories, calmer turn indicator */
.ah i{background:#12082a;border:2px solid var(--ac);color:var(--ac);box-shadow:0 0 14px var(--ac)}
.efx{margin-top:6px;padding:6px 10px;border-radius:10px;background:#ffffff0d;font-size:12px;line-height:1.35;color:var(--lc)}
.tag.catActive{background:#7c3aed66}.tag.catSupport{background:#ffffff2e}.tag.catPassive{background:#6366f166}
.phase{display:flex;align-items:center;gap:8px;white-space:normal}
.phase.chg{animation:pop2 .4s}
@keyframes pop2{50%{transform:scale(1.1)}}
.phase.en2{background:#0008;color:#fff}
.pt{padding:2px 10px;border-radius:99px;font-weight:800;background:linear-gradient(135deg,var(--v),var(--mg))}
.pt.foe{background:#fff;color:#1a0a3a}
.phase em{font-style:normal;font-size:11.5px;color:var(--lc)}
.ov.b.foe .hr{opacity:.55}
.ov.b.foe .en:not(.dead){filter:drop-shadow(0 0 10px #ffffff55)}
.en{transition:transform .25s,filter .25s}
.en.acting{z-index:3;transform:translateY(22px) scale(1.12);filter:drop-shadow(0 0 16px #fff)}
.stt{position:absolute;left:6px;top:2px;z-index:2;font-size:16px}
.stt.h{left:auto;right:4px;top:auto;bottom:70px}

<script>

if(!SUPABASE_URL.startsWith('https')){document.body.innerHTML='<p style="padding:30px;font-size:18px">Open index.html and paste your Supabase URL and key at the top of the script.</p>';throw new Error('Supabase keys missing')}

const S={tab:'home',f:'All',cards:[],inv:{},players:[],p:null};

const feat=()=>S.cards.filter(c=>c.featured).sort((a,b)=>RK[b.rarity]-RK[a.rarity]);
const featRow=()=>feat().length?`<div class="scroll">${feat().map(c=>cardHTML(c)).join('')}</div>`:'<p class="mu">No featured heroes yet.</p>';
const modal=(h,x)=>{closeM();const m=document.createElement('div');m.className='ov m';m.id='modal';m.innerHTML=`<div class="sheet">${h}${x?'':'<button class="btn alt" onclick="closeM()">Close</button>'}</div>`;m.onclick=e=>{if(e.target==m)closeM()};document.body.append(m)};
const closeM=()=>{const m=$('#modal');if(m)m.remove()};

const z2=n=>String(n).padStart(2,'0');
const nextIn=()=>S.p.last_daily?Math.max(0,new Date(S.p.last_daily).getTime()+72e6-Date.now()):0;
const cd=()=>{const t=nextIn();return t?`<span class="tb">${z2(Math.floor(t/36e5))}<small>h</small></span><span class="tb">${z2(Math.floor(t%36e5/6e4))}<small>m</small></span>`:'<p class="mu" style="margin-top:6px">Ready to claim!</p>'};
setInterval(()=>{const e=$('#cd');if(e&&S.p)e.innerHTML=cd()},30000);

const views={
  home:()=>`${hero('Summon heroes and collect them all.')}
    <h3 style="margin-top:4px">Featured heroes</h3>${featRow()}
    <button class="btn" onclick="tab('summon')">Summon now</button>
    <div class="row" style="margin-top:16px"><div class="stat"><b>${Object.keys(S.inv).length}/${S.cards.length}</b>Collected</div><div class="stat"><b>${S.p.pity}/50</b>Pity</div></div>
    <div id="inc">${incHTML()}</div>
    <div class="box dly"><div><b>Daily bonus</b><div id="cd">${cd()}</div></div><button class="btn sm" onclick="daily()">Claim 800 💎</button></div><p id="msg"></p>
    `,
  summon:()=>{const f=feat(),pos=[['fl',f[1]],['fr',f[2]],['fc',f[0]]].filter(x=>x[1]);
    return `<div class="stage" style="--c:${f[0]&&f[0].rarity=='SSR'?'#f1e6ff':'#c084fc'}"><div class="rbg"><div class="rays"></div></div>${ttl('Starfall Festival','SUMMON')}<div class="altar"></div><div class="fan">${pos.map(([k,c])=>`<div class="fanc ${k}">${cardHTML(c)}</div>`).join('')||'<p class="mu">No featured heroes yet.</p>'}</div></div>
    <p class="mu" style="text-align:center;font-size:13px;margin-top:6px">Rate-up! SR and SSR summons have at least a 50% chance to be a featured hero.</p>
    <div class="row"><span class="chip rc0">R 72%</span><span class="chip rc1">SR 25%</span><span class="chip rc2">SSR 3%</span></div>
    <div class="box pity"><div class="pr" style="--p:${S.p.pity*2}%"><b>${S.p.pity}</b></div><div><b>Pity counter</b><p class="mu" style="font-size:13px">${50-S.p.pity} summons until a guaranteed SSR.</p></div></div>
    <div class="row"><button class="btn gl sum" onclick="pull(1)">Summon 1<small>160 💎</small></button><button class="btn gold sum" onclick="pull(10)">Summon 10<small>1,600 💎</small></button></div><p id="msg"></p>`},
  tower:()=>{const t=getTeam(),cl=S.p.stage||0,wi=S.tw==null?Math.min(cl/10|0,WORLDS.length-1):S.tw,w=WORLDS[wi],base=wi*10,done=Math.max(0,Math.min(10,cl-base));
    return `${ttl('Starfall Terrarium','THE TOWER')}
    <div class="thead" style="--wh:${ph(w.hu)}"><div class="tmap">${WORLDS.map((x,i)=>i).reverse().map(i=>{const c=Math.max(0,Math.min(10,cl-i*10));return `<button class="tier${i==wi?' on':''}${i*10>cl?' lk':''}" style="--wh:${ph(WORLDS[i].hu)};--p:${c*10}%" aria-label="World ${i+1}" onclick="S.tw=${i};draw()">${i+1}</button>`}).join('')}</div>
      <div class="winfo"><small class="mu">World ${wi+1} of ${WORLDS.length}</small><h3>${w.n}</h3><p class="mu" style="font-size:13px">${w.t}</p><div class="bar"><span style="width:${done*10}%"></span></div><small class="mu">${done} of 10 floors cleared</small><div class="wem">${w.en.map(e=>e[0]).join('')}${w.bs.map(b=>b[0]).join('')}</div></div></div>
    <div class="box"><div class="dly"><h3 style="margin:0">Your team</h3><button class="btn sm" onclick="teamForm()">Edit team</button></div><div class="trow">${[0,1,2].map(i=>t[i]?`<div class="tcard">${cardHTML(t[i],0,0,0)}</div>`:'<div class="tcard empty">＋</div>').join('')}</div></div>
    <div class="spire" style="--wh:${ph(w.hu)}">${Array.from({length:10},(_,i)=>{const f=base+10-i,k=wf(f),boss=k%5==0,fin=k==10,lock=f>cl+1,en=floorEn(f),side=i%2?'r':'l',
      card=`<div class="fcd"><b>${boss?(fin?'FINAL BOSS':'BOSS'):'Floor '+f}</b><span>${en.map(e=>e.e).join('')}</span><small>${boss?esc(en[0].n):(f<=cl?'Cleared':lock?'Locked':'Ready')}</small></div>`;
      return `<button class="flr ${boss?'boss':side}${fin?' fin':''}${lock?' lock':''}${f==cl+1?' cur':''}${f<=cl?' done':''}" ${lock?'disabled':''} onclick="floorSheet(${f})">${boss?'':side=='l'?card:'<span></span>'}<span class="nd">${f<=cl?'✓':lock?'🔒':f}</span>${boss?`<div class="bc">${card}</div>`:side=='r'?card:'<span></span>'}</button>`}).join('')}</div>`},
  cards:()=>`${ttl('Your collection','HEROES')}<p class="mu">${Object.keys(S.inv).length} of ${S.cards.length} collected</p>
    <div class="tabs">${['All','SSR','SR','R'].map(r=>`<button class="${S.f==r?'on':''}" onclick="S.f='${r}';draw()">${r}</button>`).join('')}</div>
    <div class="grid">${S.cards.filter(c=>S.f=='All'||c.rarity==S.f).map(c=>cardHTML(c,S.inv[c.id],!S.inv[c.id])).join('')}</div>`,
  me:()=>{const p=S.p,fv=(p.favs||[]).map(id=>S.cards.find(c=>c.id==id)).filter(Boolean),n=Object.keys(S.inv).length,ssr=S.cards.filter(c=>S.inv[c.id]&&c.rarity=='SSR').length;
    return `<div class="pbn" style="background:${art(p.banner,270)}"></div>
    <div class="pid">${avHTML(p,'av big')}<div><h2 style="margin:0">${esc(p.display_name||S.name)}</h2><small class="mu">@${esc(S.name)}</small></div></div>
    <p>${p.bio?esc(p.bio):'<span class="mu">No bio yet. Tap Edit profile to add one.</span>'}</p>
    <div class="row"><div class="stat"><b>${n}</b>Heroes</div><div class="stat"><b>${ssr}</b>SSR</div><div class="stat"><b>${S.cards.length?Math.round(n/S.cards.length*100):0}%</b>Complete</div></div>
    <h3>Favourite heroes</h3>${fv.length?`<div class="scroll">${fv.map(c=>cardHTML(c)).join('')}</div>`:'<p class="mu">Pick up to 3 favourites in Edit profile.</p>'}
    <button class="btn" onclick="profForm()">Edit profile</button>
    <div class="row"><button class="btn ghost" onclick="mute()">Sound: ${snd()?'on':'off'}</button><button class="btn ghost" onclick="logout()">Log out</button></div>`},
  games:()=>`${ttl('Earn rewards','ARCADE')}<div class="gtiles">${Object.entries(G).map(([k,g])=>{const w=cdLeft(k),b=+localStorage.getItem('best_'+k)||0;return `<button class="gt gt-${k}${w?' cool':''}" onclick="startGame('${k}')"><i>${g.e}</i><b>${g.n}</b><small>${g.d}</small><span class="gs">${w?'⏳ '+Math.ceil(w/6e4)+' min':'Play now'}</span>${b?`<em>Best ${b}</em>`:''}</button>`}).join('')}</div><p class="mu" style="font-size:12.5px;text-align:center">Each game pays up to 30 💎 and 60 🪙 and recharges for 10 minutes.</p>`,
  admin:()=>{const pl=S.players.find(p=>p.id==S.sel)||S.players[0]||{gems:0,coins:0},af=S.af||'All';
    return `${ttl('Control room','ADMIN')}
    <div class="box"><h3 style="margin-top:0">🎁 Give rewards</h3><select id="pl" onchange="S.sel=this.value;draw()">${S.players.map(p=>`<option value="${p.id}" ${p.id==pl.id?'selected':''}>${esc(p.email||p.id.slice(0,8))}</option>`).join('')}</select>
    <div class="row"><span class="chip">💎 ${pl.gems}</span><span class="chip">🪙 ${pl.coins}</span></div>
    <div class="row"><input id="ag" type="number" placeholder="Gems (+ or -)"><input id="ac" type="number" placeholder="Coins (+ or -)"></div>
    <button class="btn" onclick="give()">Send rewards</button><p id="msg"></p></div>
    <div class="box"><div class="dly"><h3 style="margin:0">🃏 Cards (${S.cards.length})</h3><button class="btn sm" onclick="cardForm()">＋ New card</button></div>
    <p class="mu" style="font-size:12px;margin-top:6px">Tap a card to edit it. ★ featured, ✦ has an ability.</p>
    <div class="tabs">${['All','SSR','SR','R'].map(r=>`<button class="${af==r?'on':''}" onclick="S.af='${r}';draw()">${r}</button>`).join('')}</div>
    <div class="grid">${S.cards.filter(c=>af=='All'||c.rarity==af).map(c=>`<div class="adm" onclick="cardForm(${c.id})">${cardHTML(c,0,0,0)}${c.featured||c.ability?`<span class="bdg">${c.featured?'★':''}${c.ability?'✦':''}</span>`:''}</div>`).join('')}</div></div>`}
};

function draw(){
  const T=[['home','🏠','Home'],['summon','✨','Summon'],['tower','🗼','Tower'],['cards','🃏','Heroes'],['games','🎮','Games'],['me','👤','Profile']];
  app.innerHTML=`<header><div onclick="tab('me')">${avHTML(S.p)}</div><div class="hi"><small>Welcome back</small><b>Hi, ${esc(S.p.display_name||S.name)}</b></div><span class="chip">💎 ${S.p.gems.toLocaleString()}</span><span class="chip">🪙 ${S.p.coins.toLocaleString()}</span></header>
    <main>${views[S.tab]()}</main>
    <nav>${T.map(([k,i,l])=>`<button class="${k==S.tab?'on':''}" aria-label="${l}" onclick="tab('${k}')"><span>${i}</span><em>${l}</em></button>`).join('')}</nav>`;
}

function authScreen(m=''){
  app.innerHTML=`<main>${hero('Summon heroes and collect them all.')}
    <input id="em" type="email" placeholder="Email" autocomplete="email">
    <input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
    <button class="btn" onclick="authGo(1)">Log in</button><button class="btn ghost" onclick="authGo(0)">Create account</button><p id="msg">${m}</p></main>`;
}
async function authGo(l){
  const c={email:$('#em').value.trim(),password:$('#pw').value};
  const{error}=await(l?sb.auth.signInWithPassword(c):sb.auth.signUp(c));
  error?say(error.message):load();
}

async function load(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return authScreen();
  const u=session.user.id;
  const[p,c,i]=await Promise.all([sb.from('profiles').select().eq('id',u).single(),sb.from('cards').select().order('id'),sb.from('inventory').select().eq('user_id',u)]);
  const e=p.error||c.error||i.error;if(e)return authScreen(e.message);
  S.p=p.data;S.cards=c.data;S.name=session.user.email.split('@')[0];
  S.inv=Object.fromEntries(i.data.map(x=>[x.card_id,x.qty]));
  if(S.p.is_admin)S.players=(await sb.from('profiles').select('id,email,gems,coins').order('email')).data||[];
  draw();
}

const EI={Wind:'🍃',Moon:'🌙',Earth:'🌿',Fire:'🔥',Water:'💧',Metal:'⚙️',Sky:'☁️',Light:'✨',Star:'⭐',Dark:'🌑'};
const awk=n=>Math.min(5,Math.max(0,(n||0)-1));
const SPK=[['12%','22%',14],['84%','18%',11],['70%','46%',16],['20%','54%',12],['90%','60%',10],['8%','38%',15]].map(([l,t,s],i)=>`<i class="sk" style="left:${l};top:${t};font-size:${s}px;animation-delay:${i*.4}s">✦</i>`);
const dossier=(c,n)=>{const g=[];let cur=null;
  (c.dossier||'').split('\n').forEach(l=>{l=l.trim();if(!l)return;if(l[0]=='#'){cur={h:l.replace(/^#+\s*/,''),r:[]};g.push(cur)}else{const i=l.indexOf(':');if(!cur){cur={h:'Information',r:[]};g.push(cur)}cur.r.push(i<0?['',l]:[l.slice(0,i).trim(),l.slice(i+1).trim()])}});
  if(!g.length)g.push({h:'Biographical information',r:[['Name',c.name],['Title',c.title],['Element',c.element||'Unknown']]},{h:'Status',r:[['Rarity',['Rare','Epic','Legendary'][RK[c.rarity]]],['Owned',n?'Yes, x'+n:'Not yet'],['Income',`+${INC[c.rarity][0]} gems and +${INC[c.rarity][1]} coins per hour`]]});
  return g};
const ctab=(b,k)=>{document.querySelectorAll('.ctabs button').forEach(x=>x.classList.toggle('on',x==b));document.querySelectorAll('.dt section').forEach(s=>s.hidden=s.id!='c-'+k)};
const tilt=(e,el)=>{const r=el.getBoundingClientRect();el.style.setProperty('--rx',((e.clientX-r.left)/r.width-.5).toFixed(2));el.style.setProperty('--ry',((e.clientY-r.top)/r.height-.5).toFixed(2))};
const untilt=el=>{el.style.setProperty('--rx',0);el.style.setProperty('--ry',0)};
function zoom(u){const o=document.createElement('div');o.className='ov';o.style.zIndex=11;o.innerHTML=`<img class="zm" src="${u}" alt="">`;o.onclick=()=>o.remove();document.body.append(o)}
async function fav(id){
  const f=(S.p.favs||[]).slice(),i=f.indexOf(id);
  if(i>=0)f.splice(i,1);else{if(f.length>=3)return alert('You can have up to 3 favourites. Remove one first.');f.push(id)}
  const{error}=await sb.rpc('save_profile',{nm:S.p.display_name||'',av:S.p.avatar||'',bn:S.p.banner||'',bi:S.p.bio||'',fv:f});
  if(error)return alert(error.message);await load();detail(id);
}
function detail(id){
  const L=S.cards,i=L.findIndex(x=>x.id==id),c=L[i],P=L[(i+L.length-1)%L.length],N=L[(i+1)%L.length],n=S.inv[id]||0,t=RK[c.rarity],a=c.ability,can=n||S.p.is_admin,lv=awk(n),isF=(S.p.favs||[]).includes(id);
  const bt=c.kanji||c.name.toUpperCase(),fs=Math.min(40,Math.floor(127/Math.max(1,[...bt].length))),mult=1+.2*lv,inc=INC[c.rarity].map(x=>+(x*mult).toFixed(1));
  const imgs=[...new Set([c.image,c.banner,...(c.gallery||[])].filter(Boolean))],rn=['Rare','Epic','Legendary'][t];
  closeM();const m=document.createElement('div');m.className='ov d d'+t;m.id='modal';m.style.setProperty('--c',GLOW[t]);
  m.style.background=`radial-gradient(90% 40% at 50% 20%,hsl(${ph(c.hue)} 85% ${[24,30,34][t]}%),transparent),#06020e`;
  m.innerHTML=`<div class="dt">
    <div class="splash" style="--hu:${ph(c.hue)}" onpointermove="tilt(event,this)" onpointerleave="untilt(this)">
      <div class="sbg" style="background:${art(c.banner,c.hue)}"></div>${t==2?'<div class="rwrap"><div class="rays"></div></div>':''}
      <div class="strip"></div><div class="bgt" style="font-size:${fs}vw">${esc(bt)}</div>
      <div class="sart${c.fit=='contain'?' fit':''}">${c.image?`<img src="${esc(c.image)}" alt="">`:`<em>${esc(c.emoji)}</em>`}</div>
      ${t?SPK.slice(0,t*3).join(''):''}<div class="sfade"></div><div class="org">${esc(c.origin||'Starfall Academy')}</div>
      <div class="sinfo"><h2 class="nmx">${esc(c.name)}</h2><div class="sstars">${[0,1,2,3,4].map(j=>`<i class="${j<3+t?'lit':''}" style="animation-delay:${j*.25}s">✦</i>`).join('')}</div><div class="icos"><span class="ico">${EI[c.element]||'✦'}</span><span class="ico">${c.rarity}</span>${a?'<span class="ico">⚔️</span>':''}</div></div>
    </div>
    <button class="back" aria-label="Back" onclick="closeM()">‹</button>
    ${n?`<button class="heart ${isF?'on':''}" aria-label="Favourite" onclick="fav(${id})">${isF?'♥':'♡'}</button>`:''}
    <button class="ar l" aria-label="Previous hero" onclick="detail(${P.id})">‹</button><button class="ar r" aria-label="Next hero" onclick="detail(${N.id})">›</button>
    <div class="ctabs">${[['ov','Profile'],['sk','Skills'],['di','Dossier'],['st','Story'],['ga','Gallery']].map(([k,l],j)=>`<button class="${j?'':'on'}" onclick="ctab(this,'${k}')">${l}</button>`).join('')}</div>
    <section id="c-ov">${c.quote?`<blockquote class="qt">${esc(c.quote)}</blockquote>`:''}
      <div class="st3"><div><small>Element</small><b>${esc(c.element||'Unknown')}</b></div><div><small>Rarity</small><b>${rn}</b></div><div><small>Owned</small><b>${n?'×'+n:'Not yet'}</b></div></div>

async function pull(n){
  if(S.busy)return;S.busy=1;initAC();
  const{data,error}=await sb.rpc('pull_cards',{n});S.busy=0;
  if(error)return say(error.message);
  const seen={...S.inv};data.forEach(c=>{c.isNew=!seen[c.id];seen[c.id]=1});
  const best=Math.max(...data.map(c=>RK[c.rarity]));
  const ov=document.createElement('div');ov.className='ov t'+best;ov.style.setProperty('--c',GLOW[best]);
  ov.innerHTML=`<div class="fx">${intro(best)}</div>`;document.body.append(ov);
  play('intro'+best);if(best==2)setTimeout(()=>ov.classList.add('shake'),1700);
  let i=-1,ready=0,go;const t0=Date.now(),wait=new Promise(r=>go=r);
  const show=()=>{const c=data[i],t=RK[c.rarity];play('card'+t);
    ov.className='ov t'+t;ov.style.setProperty('--c',GLOW[t]);
    ov.innerHTML=`${t?'<div class="rays"></div>':''}<div class="rv r${t}">${cardHTML(c,0,0,0)}<div class="nt">${c.isNew?'NEW!':'Duplicate. Coins added.'}</div></div><p class="mu" style="margin-top:20px">Tap to continue</p>${n>1?'<button class="skip">Skip</button>':''}`;
    const s=ov.querySelector('.skip');if(s)s.onclick=()=>{i=data.length-1}};
  const sum=()=>{ov.className='ov';ov.innerHTML=`<div class="grid ten">${data.map(c=>cardHTML(c,0,0,0)).join('')}</div><p class="mu" style="margin-top:20px">Tap to close</p>`};
  const next=()=>{i++;if(i<data.length)show();else if(n>1&&i==data.length)sum();else{ov.remove();load()}};
  ov.onclick=()=>{if(ready)next();else if(Date.now()-t0>[1200,1200,2600][best])go()};
  setTimeout(go,[1700,2700,4400][best]);await wait;ready=1;next();
}

(()=>{const c=$('#sky'),x=c.getContext('2d'),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;let W,H,st=[],sh=[],T=0;
  const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight;st=Array.from({length:Math.round(W*H/9000)},()=>{const r=Math.random()*1.4+.3;return{x:Math.random()*W,y:Math.random()*H,r,p:Math.random()*6.3,s:.6+Math.random()*1.6,vx:-(2+r*3),vy:3+r*4}})};
  addEventListener('resize',rs);rs();
  const loop=t=>{const dt=Math.min(.05,(t-T)/1000||0);T=t;x.clearRect(0,0,W,H);x.fillStyle='#fff';
    for(const s of st){if(!RM){s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.y>H+3){s.y=-3;s.x=Math.random()*W}if(s.x<-3)s.x=W+3}
      x.globalAlpha=.3+.7*Math.abs(Math.sin(t/1000*s.s+s.p));x.beginPath();x.arc(s.x,s.y,s.r,0,6.3);x.fill()}
    if(!RM&&Math.random()<.008)sh.push({x:Math.random()*W+W/3,y:-20,v:6+Math.random()*5});
    x.lineWidth=2;x.globalAlpha=1;
    for(const m of sh){m.x-=m.v*.7;m.y+=m.v;const g=x.createLinearGradient(m.x,m.y,m.x+m.v*6.3,m.y-m.v*9);g.addColorStop(0,'#fff');g.addColorStop(1,'#fff0');x.strokeStyle=g;x.beginPath();x.moveTo(m.x,m.y);x.lineTo(m.x+m.v*6.3,m.y-m.v*9);x.stroke()}
    sh=sh.filter(m=>m.y<H+60);if(!RM)requestAnimationFrame(loop)};
  requestAnimationFrame(loop)})();

  $('#er').innerHTML=B.en.map((e,i)=>{const m=hel?mulEl(hel,e.el):1,it=intent(e);return `<div class="en${e.boss?' bossy':''}${e.hp<=0?' dead':''}${e.brk?' brk':''}${i==B.acting?' acting':''}" id="e${i}" style="--dl:${dl}" onclick="B.t=${i};bdraw()">${e.hp>0?`<div class="itb ${it}">${INT[it]} ${INL[it]}</div>`:''}<div class="eb">${i==t&&!B.enemyTurn?'<i class="rt"></i>':''}<span class="em">${e.e}</span><i class="eel">${EI[e.el]||''}</i>${e.burn?'<span class="stt">🔥</span>':''}${e.brk?'<span class="bk">BREAK</span>':''}</div><b>${esc(e.n)}</b><div class="hb"><span style="width:${e.hp/e.mhp*100}%"></span></div><div class="gp">${Array.from({length:e.mg},(_,q)=>`<i class="${q<e.gd?'on':''}"></i>`).join('')}</div><small>${e.hp}/${e.mhp}${m>1?' ▲':m<1?' ▼':''}</small></div>`}).join('');
  $('#pr').innerHTML=B.team.map((x,i)=>{const on=i==B.i&&!B.enemyTurn&&x.hp>0;return `<div class="hr${x.hp<=0?' dead':''}${on?' act':''}" id="h${i}" style="--dl:${dl}">${on?'<i class="mk">▼</i>':''}${cardHTML(x.c,0,0,0)}${x.sh>0?`<span class="shd">🛡️${x.sh}</span>`:''}${x.hot?'<span class="stt h">💚</span>':''}<div class="hb"><span style="width:${x.hp/x.mhp*100}%"></span></div><small class="hpn">${x.hp}/${x.mhp}</small><div class="ug${x.g>=100?' full':''}"><span style="width:${x.g}%"></span></div></div>`}).join('');
  if(!h||B.over){$('#ac').innerHTML='';return}
  const ac=acts(h),ul=ac.find(a=>a.ult),sk=ac.filter(a=>!a.ult),av=h.c.image?`<i style="background:url('${esc(h.c.image)}') center/cover"></i>`:`<i>${esc(h.c.emoji)}</i>`;
  $('#ac').innerHTML=`<div class="cl"><div class="who">${av}<div><b>${esc(h.c.name)}</b><small>${B.lock?(B.enemyTurn?'Enemy turn':'Acting...'):'Choose an action'}</small></div></div><div class="cg">${sk.map(a=>`<button class="ab" ${a.off||B.lock?'disabled':''} onclick="act('${a.k}',${a.j??0})"><i>${a.i}</i><b>${esc(a.n)}</b><small>${esc(a.l)}</small>${a.k=='skill'&&h.cd[a.j]>0?`<span class="cdn">${h.cd[a.j]}</span>`:''}</button>`).join('')}</div></div>
    <button class="ubtn${ul&&h.g>=100?' rdy':''}" style="--g:${h.g}" ${!ul||h.g<100||B.lock?'disabled':''} onclick="act('ult',0)"><span class="ugr"></span><b>${ul?esc(ul.n):'No ultimate'}</b><small>${ul?(h.g>=100?'READY':h.g+'%'):'-'}</small></button>`;
}
function startTurn(){B.enemyTurn=0;B.acting=-1;B.lock=0;say2('Tap an enemy to change your target.');bdraw();if(B.auto)tm(autoStep,1000/B.sp)}
function startBattle(f){
  const t=getTeam();if(!t.length)return alert('You need at least one hero. Summon some first!');
  const w=wOf(f),k=wf(f),boss=k%5==0,en=floorEn(f);closeG();
  const o=document.createElement('div');o.className='ov g b'+(boss?' boss':'');o.id='game';o.style.setProperty('--wh',ph(w.hu));
  o.innerHTML=`<div class="gbar"><button class="back" onclick="closeG()">‹</button><b>Floor ${f}<small class="mu">${w.n}</small></b><button class="hb2" id="au" onclick="toggleAuto()">Auto: off</button><button class="hb2" id="sp" onclick="toggleSpeed()">x1</button></div><div class="bwm">${boss?en[0].e:w.en[0][0]}</div>
    <div class="bstage"><span class="phase" id="ph"></span><div class="erow" id="er"></div><p class="log" id="lg"></p><div class="prow" id="pr"></div></div><div class="cmd" id="ac"></div>
    ${boss?bossIntro(en[0],k,w):`<div class="fint"><small>${w.n}</small><b>FLOOR ${f}</b></div>`}`;
  document.body.append(o);
  B={f,round:1,i:0,t:0,lock:1,over:0,sp:1,auto:0,chain:0,enemyTurn:0,team:t.map(unit),en};bdraw();
  if(boss){tone(45,0,2.6,'sawtooth',.18,28);hiss(.2,2,.4,200);tone(70,2,1.3,'square',.12,30);hiss(2,.8,.5,1200);tm(shk,600);tm(()=>{shk();gflash()},2000)}
  tm(()=>{o.classList.add('intro');tm(()=>o.classList.remove('intro'),900);startTurn()},boss?3500:1900);
}
async function act(k,j){
  if(B.lock||B.over)return;
  const h=B.team[B.i],a=acts(h).find(x=>x.k==k&&(k!='skill'||x.j==j));if(!a||a.off)return;
  B.lock=1;B.chain++;bdraw();
  const P=a.P,atk=h.atk*tb()*(1+.15*(B.chain-1)),al=()=>B.en.map((e,i)=>i).filter(i=>B.en[i].hp>0),ti=(B.en[B.t]&&B.en[B.t].hp>0)?B.t:al()[0];
  const heal=(x,v)=>{x.hp=Math.min(x.mhp,x.hp+Math.round(v))};
  const dmgTo=(i,m,u)=>{const e=B.en[i];if(e.hp<=0)return;const el=mulEl(h.c.element,e.el),cr=Math.random()<h.crit,ex=P.exec&&e.hp<e.mhp*.35?1.67:1,d=Math.round(atk*m*ex*el*(e.brk?1.5:1)*(.9+Math.random()*.2)*(cr?1.5:1));let pre=(cr?'CRIT ':'')+(el>1?'▲ ':el<1?'▼ ':'');
    e.hp=Math.max(0,e.hp-d);h.dmg+=d;if(h.ls)heal(h,d*h.ls);if(P.drain)heal(h,d*P.drain);
    const gd=(el>1?(u?2:1):0)+(P.brk||0);if(gd&&e.gd>0&&e.hp>0){e.gd=Math.max(0,e.gd-gd);if(!e.gd){e.brk=1;e.stun=1;pre='BREAK! '}}
    if(P.dot&&e.hp>0)e.burn={t:3,v:Math.max(1,Math.round(atk*.25))};
    bdraw();hurt('#e'+i,d,0,pre)};
  if(a.ult){h.g=0;say2(`${h.c.name}: ${a.n}!`);bdraw();playScene(h.c.ability,h.c);await sceneEnd();al().forEach(i=>dmgTo(i,2.4,1));shk();gflash()}
  else if(P.c=='Support'){
    h.g=Math.min(100,h.g+25+h.ug);
    const al2=B.team.map((x,i)=>i).filter(i=>B.team[i].hp>0),wk=al2.slice().sort((p,q)=>B.team[p].hp/B.team[p].mhp-B.team[q].hp/B.team[q].mhp)[0],fx=[];
    const hl=(i,v)=>{heal(B.team[i],v);fx.push([i,'+'+Math.round(v)])},sh=(i,v)=>{B.team[i].sh+=Math.round(v);fx.push([i,'🛡️+'+Math.round(v)])};
    if(P.heal)al2.forEach(i=>hl(i,atk*P.heal));
    if(P.mend)hl(wk,atk*P.mend);
    if(P.shield)al2.forEach(i=>sh(i,atk*P.shield));
    if(P.ward)sh(wk,atk*P.ward);
    if(P.buff){B.buff={v:P.buff,t:2};fx.push([B.i,'TEAM ATK UP'])}
    if(P.surge)al2.forEach(i=>{B.team[i].g=Math.min(100,B.team[i].g+P.surge);fx.push([i,'+'+P.surge+'% CHARGE'])});
    if(P.regen)al2.forEach(i=>{B.team[i].hot={v:Math.round(atk*P.regen),t:3};fx.push([i,'REGEN'])});
    if(P.revive){const q=B.team.findIndex(x=>x.hp<=0);if(q>=0){B.team[q].hp=Math.round(B.team[q].mhp*P.revive);fx.push([q,'REVIVED'])}}
    bdraw();fx.forEach(([i,t])=>fxAt(...ctr('#h'+i),5,t));tone(660,0,.3,'sine',.1,990);say2(`${h.c.name} uses ${a.n}!`)}
  else{h.g=Math.min(100,h.g+(a.k=='strike'?20:30)+h.ug);say2(a.k=='strike'?`${h.c.name} strikes!`:`${h.c.name} uses ${a.n}!`);
    const tg=P.aoe?al():[ti],hits=P.hits||1;
    for(let q=0;q<hits;q++){for(const i of tg)dmgTo(i,P.m||1);if(hits>1)await wait(300)}
    if(P.stun&&B.en[ti].hp>0){const e=B.en[ti];if(e.boss)say2(`${e.n} is immune to stun!`);else{e.stun=1;say2(`${e.n} is stunned!`)}}}
  if(a.k=='skill')h.cd[a.j]=P.cd;
  bdraw();await wait(800);
  if(!B.en.some(e=>e.hp>0))return bend(1);
  let n=B.i+1;while(n<B.team.length&&B.team[n].hp<=0)n++;
  if(n<B.team.length)B.i=n;
  else{B.enemyTurn=1;say2('The enemies strike back!');bdraw();await wait(900);
    const hitH=(e,q,m)=>{const x=B.team[q];let d=Math.round(e.atk*m*(.9+Math.random()*.2)*(1-x.dr)),ab=Math.min(x.sh,d);x.sh-=ab;d-=ab;x.hp=Math.max(0,x.hp-d);x.g=Math.min(100,x.g+10);bdraw();hurt('#h'+q,d);
      if(x.ctr&&x.hp>0&&e.hp>0&&Math.random()<x.ctr){const c2=Math.round(x.atk*.6);e.hp=Math.max(0,e.hp-c2);x.dmg+=c2;bdraw();hurt('#e'+B.en.indexOf(e),c2,0,'COUNTER ')}};
    for(const e of B.en){if(e.hp<=0)continue;const ei=B.en.indexOf(e);B.acting=ei;
      if(e.burn){const d=e.burn.v;e.hp=Math.max(0,e.hp-d);if(--e.burn.t<=0)e.burn=null;bdraw();hurt('#e'+ei,d,0,'BURN ');await wait(550);if(e.hp<=0)continue}
      if(e.stun){e.stun=0;if(e.brk){e.brk=0;e.gd=e.mg}say2(`${e.n} is stunned and loses its turn.`);bdraw();await wait(650);continue}
      if(e.boss&&!e.rage&&e.hp<e.mhp/2){e.rage=1;e.atk=Math.round(e.atk*1.25);say2(`${e.n} is enraged!`);shk();gflash();bdraw();await wait(800)}
      const it=intent(e),al2=B.team.map((x,q)=>q).filter(q=>B.team[q].hp>0);if(!al2.length)break;
      say2(`${e.n} uses ${it=='heavy'?'a heavy blow':it=='aoe'?'a sweeping attack':'an attack'}!`);bdraw();await wait(350);
      if(it=='aoe')al2.forEach(q=>hitH(e,q,.9));else hitH(e,al2[Math.random()*al2.length|0],it=='heavy'?1.8:1);
      await wait(650)}
    B.acting=-1;
    if(!B.en.some(e=>e.hp>0))return bend(1);
    if(!B.team.some(x=>x.hp>0))return bend(0);
    B.team.forEach((x,i)=>{if(x.hp<=0)return;const r=Math.round(x.mhp*x.rg)+(x.hot?x.hot.v:0);if(x.hot&&--x.hot.t<=0)x.hot=null;if(r){heal(x,r);bdraw();fxAt(...ctr('#h'+i),4,'+'+r)}});
    if(B.buff&&--B.buff.t<=0)B.buff=null;
    B.round++;B.chain=0;B.team.forEach(x=>x.cd=x.cd.map(v=>Math.max(0,v-1)));B.i=B.team.findIndex(x=>x.hp>0)}
  startTurn();
}
async function nextFloor(f){closeG();await load();if(f<MAXF&&f+1<=S.p.stage+1)startBattle(f+1)}
async function bend(win){
  B.over=1;B.lock=1;B.enemyTurn=0;bdraw();const o=$('#game');if(!o)return;const f=B.f;
  if(!win){tone(200,0,.6,'sine',.3,60);o.insertAdjacentHTML('beforeend',`<div class="bres"><div class="res"><h2>Defeat</h2><p class="mu">Hit weaknesses to break enemy guards, chain your heroes, use ultimates, or awaken heroes with extra copies.</p><button class="btn" onclick="startBattle(${f})">Retry</button><button class="btn ghost" onclick="closeG()">Back to tower</button></div></div>`);return}
  const{data,error}=await sb.rpc('tower_win',{f}),st=B.team.filter(x=>x.hp>0).length,mv=[...B.team].sort((a,b)=>b.dmg-a.dmg)[0];
  play('card2');fxAt(...mid(),30);
  o.insertAdjacentHTML('beforeend',`<div class="bres"><div class="res"><div class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div><h2>${f%10==0?'World cleared!':'Floor cleared!'}</h2><p class="mu">MVP: ${esc(mv.c.name)} with ${mv.dmg} damage</p>${error?`<p class="mu">${esc(error.message)}</p>`:`<p class="rw">+${data.gems} 💎 +${data.coins} 🪙</p><p class="mu">${data.first?'First clear bonus!':'Replay reward'}</p>`}${f<MAXF?`<button class="btn" onclick="nextFloor(${f})">Next floor</button>`:''}<button class="btn ghost" onclick="closeG();load()">Back to tower</button></div></div>`);
}

// Header gets a dark background once you scroll
const _draw=draw;draw=function(){_draw();const m=$('main'),h=$('header');if(m&&h)m.onscroll=()=>h.classList.toggle('sc',m.scrollTop>20);setFab();if(S.tab=='tower'){const c=document.querySelector('.flr.cur');if(c)c.scrollIntoView({block:'center'})}};

  const id=$('#pl').value,p=S.players.find(x=>x.id==id);S.sel=id;
  const g=+$('#ag').value||0,c=+$('#ac').value||0;

let GAL=[];
const galDraw=()=>{const e=$('#gal');if(e)e.innerHTML=GAL.map((u,i)=>`<div class="gth" style="background:url('${esc(u)}') center/cover"><button type="button" aria-label="Remove" onclick="GAL.splice(${i},1);galDraw()">✕</button></div>`).join('')};
async function galAdd(el){
  const f=el.files[0];if(!f)return;
  try{if(!f.type.startsWith('image/'))throw new Error('Please choose an image file.');
    const b=await shrink(f,1000),p=Date.now()+'-'+Math.random().toString(36).slice(2,6)+'.'+(b.type.split('/')[1]||'img');
    const{error}=await sb.storage.from('cards').upload(p,b,{contentType:b.type});if(error)throw error;
    GAL.push(sb.storage.from('cards').getPublicUrl(p).data.publicUrl);galDraw();
  }catch(e){alert('Upload failed: '+e.message)}
  el.value='';
}
function cardForm(id){
  const c=S.cards.find(x=>x.id==id)||{rarity:'R',hue:270,featured:false},a=c.ability||{},cur=a.color||COLORS[0];GAL=[...(c.gallery||[])];
  const f=(k,l,t='text')=>`<label>${l}<input id="f_${k}" type="${t}" value="${esc(c[k]??'')}"></label>`;
  const T=(k,l,r)=>`<label>${l}<textarea id="f_${k}" rows="${r}">${esc(c[k]||'')}</textarea></label>`;
  const A=(k,l)=>`<label>${l}<input id="a_${k}" value="${esc(a[k]??'')}"></label>`;

    <details class="es" open><summary>Basics</summary>${f('name','Name')}${f('title','Title')}
      <label>Rarity<select id="f_rarity">${['R','SR','SSR'].map(r=>`<option ${r==c.rarity?'selected':''}>${r}</option>`).join('')}</select></label>
      ${f('element','Element (Wind, Moon, Fire, Water, Star, Dark, Light, Sky, Metal, Earth)')}${f('emoji','Emoji (used when there is no art)')}${f('hue','Color shade (0 to 360)','number')}
      ${T('descr','Short description',3)}

    <details class="es"><summary>Art and banner</summary>
      ${picker('image','Card art (a tall portrait or a transparent cutout works best)',c.image,c.hue,0)}
      <label>How to show the art<select id="f_fit"><option value="cover" ${c.fit!='contain'?'selected':''}>Fill the whole top area</option><option value="contain" ${c.fit=='contain'?'selected':''}>Fit inside (best for transparent cutouts)</option></select></label>
      ${picker('banner','Backdrop banner (wide picture behind the art)',c.banner,c.hue,0)}</details>
    <details class="es"><summary>Profile page</summary><p class="hint">These fill the Profile, Dossier, Story and Gallery tabs on the card page.</p>
      ${f('kanji','Big background text (leave empty to use the name)')}${f('origin','Series or school (shown at the top)')}${f('quote','Quote')}

    <details class="es" ${c.ability?'open':''}><summary>✦ Ultimate (cutscene)</summary><p class="hint">Type an ultimate name to give this card an ultimate. Leave the name empty for none.</p>
      ${A('name','Ultimate name (main title)')}${A('sub','Subtitle or quote')}<label>Description<textarea id="a_desc" rows="2">${esc(a.desc||'')}</textarea></label>
      <label>Cutscene effect<select id="a_fx">${opts(FXN,a.fx)}</select></label>

      ${A('text','Cutscene title (optional, defaults to the name)')}

      <label>Sound<select id="a_sound">${opts(SND,a.sound)}</select></label>
      <div class="tg"><label><input id="a_shake" type="checkbox" ${a.shake!==false?'checked':''}> Screen shake</label><label><input id="a_flash" type="checkbox" ${a.flash!==false?'checked':''}> Flash</label><label><input id="a_bars" type="checkbox" ${a.bars!==false?'checked':''}> Cinema bars</label></div>

  galDraw();
}
const shrink=(f,m=1000)=>f.type=='image/gif'?Promise.resolve(f):new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,m/Math.max(i.width,i.height)),k=document.createElement('canvas');k.width=i.width*s;k.height=i.height*s;k.getContext('2d').drawImage(i,0,0,k.width,k.height);k.toBlob(b=>r(b||f),'image/webp',.9)};i.onerror=()=>r(f);i.src=URL.createObjectURL(f)});
async function upl(el,k,pr){
  const f=el.files[0];if(!f)return;
  const sp=$('#p_'+k+' span'),say2=t=>{if(sp)sp.textContent=t};
  try{
    if(!f.type.startsWith('image/'))throw new Error('Please choose an image file.');
    say2('⏳ Uploading...');
    const b=await shrink(f,pr?700:1000),bk=pr?'avatars':'cards',p=(pr?S.p.id+'/':'')+Date.now()+'-'+Math.random().toString(36).slice(2,6)+'.'+(b.type.split('/')[1]||'img');
    const{error}=await sb.storage.from(bk).upload(p,b,{contentType:b.type});
    if(error)throw error;
    const u=sb.storage.from(bk).getPublicUrl(p).data.publicUrl;
    $('#f_'+k).value=u;$('#p_'+k).style.background=art(u,270);say2('✅ Uploaded. Tap to change');
  }catch(e){say2('📷 Choose from gallery');alert('Upload failed: '+e.message)}
  el.value='';
}
async function saveCard(id){
  const g=k=>$('#f_'+k).value.trim();
  const row={name:g('name'),title:g('title'),rarity:g('rarity'),element:g('element'),emoji:g('emoji'),hue:+g('hue')||0,descr:g('descr'),image:g('image')||null,banner:g('banner')||null,featured:$('#f_featured').checked,
    fit:g('fit'),kanji:g('kanji')||null,origin:g('origin')||null,quote:g('quote')||null,lore:g('lore')||null,dossier:g('dossier')||null,gallery:GAL,skills:readSk(),ability:readAb()};
  if(id)row.id=id;
  const{error}=await sb.from('cards').upsert(row);
  if(error)return alert(error.message);
  closeM();load();
}
async function delCard(id){
  if(!confirm('Delete this card for every player?'))return;
  const{error}=await sb.from('cards').delete().eq('id',id);
  if(error)return alert(error.message);
  closeM();load();
}
